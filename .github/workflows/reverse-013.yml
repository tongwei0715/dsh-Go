# Temporary, never merged. Runs what the full CI does not glob, for requestfromweb-013.
name: reverse-013

on:
  push:
    branches: [reverse/refactor3-013]

permissions:
  contents: read

env:
  NODE_VERSION: 24.22.1
  FLUTTER_VERSION: 3.47.7
  GRADLE_VERSION: 9.3.1
  TZ: Asia/Shanghai

jobs:
  node:
    name: R013 node tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: safe-home-helper-live.mjs
        run: |
          set +e
          echo "R013: head=$(git rev-parse HEAD) node=$(node --version) platform=$(node -p process.platform)"
          node --test --test-reporter=spec runtime/tests/safe-home-helper-live.mjs > safe.out 2>&1
          code=$?
          cat safe.out
          echo "R013: safe-home-helper-live exit=$code"
          grep -E '^ℹ (tests|pass|fail|skipped|cancelled|todo) ' safe.out | sed 's/^/R013: safe-home-helper-live /'
          grep -E '^\s*(✖|✔|﹣)|^\s*# (SKIP|skip)' safe.out | sed 's/^/R013: safe-home-helper-live case: /'
          exit 0
      - name: dns.test.mjs
        run: |
          set +e
          node --test --test-reporter=spec runtime/tests/direct/dns.test.mjs > dns.out 2>&1
          code=$?
          cat dns.out
          echo "R013: dns exit=$code"
          grep -E '^ℹ (tests|pass|fail|skipped|cancelled|todo) ' dns.out | sed 's/^/R013: dns /'
          grep -E '^\s*(✖|✔|﹣)' dns.out | sed 's/^/R013: dns case: /'
          exit 0
  kotlin:
    name: R013 kotlin
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      DSH_MAVEN_MIRRORS: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Environment and plugins
        working-directory: app
        run: |
          set +e
          echo "R013: head=$(git rev-parse HEAD) id=$(id)"
          echo "R013: $(java -version 2>&1 | head -1) | $(gradle --version 2>&1 | grep -E '^Gradle')"
          flutter pub get --enforce-lockfile
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$ANDROID_HOME" "$FLUTTER_ROOT" > android/local.properties
          exit 0
      - name: Full testArm64DebugUnitTest
        working-directory: app/android
        run: |
          set +e
          gradle --stacktrace :app:testArm64DebugUnitTest
          echo "R013: gradle exit=$?"
          exit 0
      - name: JUnit XML of this run
        run: |
          set +e
          find "$GITHUB_WORKSPACE" -name 'TEST-*.xml' -path '*testArm64DebugUnitTest*' | sort | sed 's/^/R013: junit-found| /' | head -3
          python3 .reverse/013/junit.py $(find "$GITHUB_WORKSPACE" -name 'TEST-*.xml' -path '*testArm64DebugUnitTest*' | sort)
          echo "R013: junit python exit=$?"
          exit 0
